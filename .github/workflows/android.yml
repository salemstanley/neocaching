# Builds the Android app on every push to main and attaches it to the
# "latest" release, so the newest version is always one tap away.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build the app
        working-directory: android
        # Pixel phones only need the arm64 build, which keeps this faster.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk neocaching.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest neocaching.apk \
            --title "Latest Neocaching build" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open this page on your phone and tap neocaching.apk to install."
